<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070606">
<link rel="icon" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Página no encontrada · Emily Pizza</title>
<meta name="description" content="Esta página no existe. Vuelve al menú de Emily Pizza.">
<meta name="robots" content="noindex">
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/albert-sans.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Fraunces";src:url(/fonts/fraunces.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Albert Sans";src:url(/fonts/albert-sans.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
*{font-variation-settings:"SOFT" 50,"WONK" 0}
</style>
<style>
:root{--bg:#070606;--panel:#121110;--fg:#efe7da;--muted:#b3ab9f;--line:rgba(239,231,218,.14);--gold:#c9ab7c;--btn:#efe7da;--btn-fg:#151311;
  --display:"Fraunces",Georgia,"Times New Roman",serif;--body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f0e7;--panel:#fffdf9;--fg:#1d1a16;--muted:#5e574e;--line:rgba(29,26,22,.14);--gold:#7f6131;--btn:#1d1a16;--btn-fg:#f5f0e7;color-scheme:light}}
:root[data-theme="light"]{--bg:#f5f0e7;--panel:#fffdf9;--fg:#1d1a16;--muted:#5e574e;--line:rgba(29,26,22,.14);--gold:#7f6131;--btn:#1d1a16;--btn-fg:#f5f0e7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--fg);text-decoration-color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.top img{width:110px;height:auto}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;text-decoration:none;font-weight:600;font-size:.9rem}
h1{font-family:var(--display);font-weight:500;font-size:clamp(2rem,7vw,2.6rem);line-height:1.1;margin:0 0 6px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:1.35rem;margin:34px 0 8px}
p,li{max-width:65ch}
ul{padding-left:20px}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 24px}
.box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);font-size:.95rem}
.logo-l{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .logo-d{display:none}:root:not([data-theme="dark"]) .logo-l{display:block}}
:root[data-theme="light"] .logo-d{display:none}:root[data-theme="light"] .logo-l{display:block}

.nf{min-height:100vh;display:grid;place-items:center;text-align:center;padding-block:40px}
.nf .in{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:420px}
.nf img{width:min(60vw,220px);height:auto;margin-bottom:10px}
.nf .code{font-family:var(--display);font-size:4.5rem;line-height:1;color:var(--gold)}
.nf p{color:var(--muted);margin:4px 0 18px}
.nf .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 20px;font-weight:600;text-decoration:none;border:1px solid var(--line)}
.btn-main{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
</style>
<script>try{var t=JSON.parse(localStorage.getItem("emily-theme"));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<main class="wrap nf">
  <div class="in">
    <img class="logo-d" src="/img/logo.webp" alt="Emily Pizza" width="600" height="550">
    <img class="logo-l" src="/img/logo-dark.webp" alt="Emily Pizza" width="600" height="550">
    <div class="code" aria-hidden="true">404</div>
    <h1>Esta página se nos quemó en el horno</h1>
    <p>La dirección que abriste no existe o cambió. El menú sigue calientico.</p>
    <div class="actions">
      <a class="btn btn-main" href="/">Ver el menú</a>
      <a class="btn" href="/#combos">Ver combos</a>
    </div>
  </div>
</main>
</body>
</html>
